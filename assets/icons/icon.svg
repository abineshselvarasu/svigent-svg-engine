<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b4a78"/>
      <stop offset="1" stop-color="#0b1f35"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5c96"/>
      <stop offset="1" stop-color="#0e2c4d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6cf6b"/>
      <stop offset="1" stop-color="#d9962b"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb547"/>
      <stop offset="1" stop-color="#f26b1d"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Shield -->
  <path d="M128 26 L208 56 V122 C208 172 174 208 128 232 C82 208 48 172 48 122 V56 Z"
        fill="url(#shield)" stroke="url(#gold)" stroke-width="9" stroke-linejoin="round"/>

  <!-- Bezier "S" -->
  <path d="M162 84 C162 62 94 60 94 96 C94 128 162 120 162 156 C162 192 94 190 94 168"
        fill="none" stroke="url(#curve)" stroke-width="22" stroke-linecap="round"/>

  <!-- Vector handles -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="128" y1="126" x2="96" y2="126" opacity="0.9"/>
    <line x1="128" y1="126" x2="160" y2="126" opacity="0.9"/>
  </g>
  <circle cx="92" cy="126" r="7" fill="#f6cf6b"/>
  <circle cx="164" cy="126" r="7" fill="#f6cf6b"/>
  <rect x="118" y="116" width="20" height="20" rx="4" fill="#0e2c4d" stroke="#ffffff" stroke-width="5"/>
</svg>
